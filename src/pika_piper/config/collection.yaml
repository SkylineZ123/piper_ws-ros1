# Run record_session.py with your Python 3.12 environment. The writer uses
# that same interpreter (sys.executable); no separate Python path is needed.
repo_id: pika_piper/pick_and_place_tube
output_dir: ../../../data/pika_lerobot  # relative to this YAML; --output overrides
action_type: joint              # joint or eef6d (xyz + RPY + gripper)
max_timesteps: 5000
image_height: 480
image_width: 640
video_codec: h264
streaming_encoding: true
encoder_threads: 2
encoder_queue_maxsize: 60
alignment_delay: 0.06           # wait for future state bracket/camera neighbor
alignment_timeout: 0.5          # pause on missing streams or acquisition backlog
status_timeout: 0.5
enable_view: true
view_max_width: 1280
use_back_event: true

subtasks:
  '1': approach
  '2': grasp
  '3': move
  '4': release
