# ============================================================
# Piper 双臂遥操作数据采集配置 (lerobot v6)
# 使用: rosrun dual_piper data_to_lerobot3_node.py
#       可选指定配置文件: _config_file:=/path/to/collection.yaml
# ============================================================

dataset:
  # 数据集存储根目录 (v6 格式: data/ videos/ meta/)
  target_dir: "/home/zhl/data/CubeTransfer_test"
  # 数据集名称 (HF 风格 repo_id)
  repo_id: "RoboMLT/CubeTransfer"
  # 任务名称 (单一任务, 无子任务; 写入 meta/tasks.parquet)
  task_name: "cube transfer"
  # 采集帧率
  fps: 25
  # false=新建数据集; true=追加到已有数据集 (resume 前自动修复一致性)
  resume: false
  # 视频编码器: h264_nvenc (NVIDIA GPU) / h264 (libx264) / libsvtav1 / auto
  video_codec: "h264_nvenc"
  # 流式编码: 帧到达即编码, save_episode 时接近瞬时
  streaming_encoding: true
  # 单集最大帧数, 达到后自动暂停
  max_frames_per_episode: 10000

robot:
  # dual_piper (14 自由度) | single_piper_left | single_piper_right (7 自由度)
  robot_type: "dual_piper"

camera:
  # 是否显示 OpenCV 实时预览窗口 (false 可提高帧率)
  enable_view: true
  # 相机序列号 (供 teleoperation.launch 使用)
  serial_no_top: "327122074756"
  serial_no_left: "148522072680"
  serial_no_right: "241222073777"
